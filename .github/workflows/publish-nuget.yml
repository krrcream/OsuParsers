
# .github/workflows/publish-nuget.yml

name: Publish to NuGet

on:
  push:
    tags:
      - '*.*.*.*'
      - 'v*.*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '7.x'

      - name: Extract version from tag
        id: version
        run: |          
          TAG_VERSION=$(echo ${{ github.ref_name }} | sed 's/^v//')
          echo "VERSION=$TAG_VERSION" >> $GITHUB_ENV

      - name: Build and Pack
        run: |
          dotnet restore OsuParsers/OsuParsers.csproj
          dotnet pack OsuParsers/OsuParsers.csproj \
                    --configuration Release \
                    /p:PackageVersion=${{ env.VERSION }} \
                    --output ./artifacts

      - name: Publish to NuGet
        run: |
          dotnet nuget push artifacts/*.nupkg \
          -s https://api.nuget.org/v3/index.json \
          -k ${{ secrets.NUGET_API_KEY }} \
          --skip-duplicate
          
      - name: Update project version
        run: |
          sed -i "s/<AssemblyVersion>.*<\/AssemblyVersion>/<AssemblyVersion>${{ env.VERSION }}<\/AssemblyVersion>/" OsuParsers/OsuParsers.csproj
          sed -i "s/<FileVersion>.*<\/FileVersion>/<FileVersion>${{ env.VERSION }}<\/FileVersion>/" OsuParsers/OsuParsers.csproj

      - name: Commit version update
        run: |    
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add OsuParsers/OsuParsers.csproj
          git commit -m "Update version to ${{ env.VERSION }}"
          git push